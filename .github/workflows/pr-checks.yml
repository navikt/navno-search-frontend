name: PR Checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    with:
      push-image: false
      # Rebuilds with a pinned test env, so it can't be a part of `pnpm test`
      post-build-commands: pnpm run test:http
    secrets: inherit
