name: PR Checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    with:
      push-image: false
      build-cache-paths: .next/cache
      env-file: |
        NODE_ENV=production
        APP_BASE_PATH=/sok
        APP_ORIGIN=https://www.ansatt.dev.nav.no
        SEARCH_URL=https://navno-search-api.ekstern.dev.nav.no/content/search
        ENV=dev
    secrets: inherit
