name: Deploy to dev
on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    with:
      github-environment: dev
      image-suffix: dev-deploy
      build-cache-paths: .next/cache
      env-file: |
        NODE_ENV=production
        APP_BASE_PATH=/sok
        APP_ORIGIN=https://www.ansatt.dev.nav.no
        SEARCH_URL=http://navno-search-api.navno/content/search
        ENV=dev
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    with:
      cluster: dev-gcp
      resource: .nais/config.yml
      vars: .nais/vars-dev.yml
      var: image=${{ needs.build.outputs.image }}
