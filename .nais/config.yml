---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{appName}}
  namespace: navno
  labels:
    team: navno
spec:
  image: {{image}}
  port: 3001
  liveness:
    path: /sok/api/internal/isAlive
    initialDelay: 5
  readiness:
    path: /sok/api/internal/isReady
    initialDelay: 5
  prometheus:
    enabled: true
    path: /sok/api/internal/metrics
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
  env:
    # Through service discovery, so the same in both clusters
    - name: SEARCH_URL
      value: http://navno-search-api.navno/content/search
    # Only for the page's canonical and og: URLs, the app never calls it
    - name: APP_ORIGIN
      value: https://{{appHost}}
  replicas:
  {{#with replicas}}
    min: {{min}}
    max: {{max}}
  {{/with}}
  # Dekoratøren and nav-search-api are both reached through service discovery, so nothing external
  accessPolicy:
    outbound:
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
        - application: navno-search-api
          namespace: navno
  resources:
  {{#with resources}}
    requests:
      cpu: {{requests.cpu}}
      memory: {{requests.memory}}
    limits:
      memory: {{limits.memory}}
  {{/with}}
