# The canary: alerts on what users see. When one fires, navno-search-api's own metrics tell whether it's us or the API.
# Deployed by build-deploy-prod.yml. No double curly braces in this file, not even in comments: nais deploy templates every resource with Handlebars.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: navno-search-frontend-alerts
  namespace: navno
  labels:
    team: navno
spec:
  groups:
    - name: navno-search-frontend
      rules:
        # A failed search is followed by one for the unfiltered listing, so an API that's down counts two errors per page load
        - alert: NavnoSearchErrors
          expr: |
            sum(increase(navno_search_requests_total{app="navno-search-frontend",status="error"}[10m])) > 5
            and
            sum(rate(navno_search_requests_total{app="navno-search-frontend",status="error"}[10m]))
              / sum(rate(navno_search_requests_total{app="navno-search-frontend"}[10m])) > 0.05
          for: 5m
          annotations:
            summary: Over 5 % of searches in navno-search-frontend fail
            consequence: Users get the unfiltered listing instead of their hits, or an error page if that fails too.
            action: Check logs - should have "Search failed", with a status or a timeout. Check that navno-search-api is up, and its own metrics.
          labels:
            namespace: navno
            severity: critical

        # Health signal, searches are happening during sane hours
        # "or vector(0)" covers the series not existing at all. hour() and day_of_week() are UTC, so 08-15 is 09-16 Oslo-time in winter and 10-17 in summer (always inside 09-17). Weekdays only (1-5): weekend traffic is too sparse to expect a hit every hour.
        - alert: NavnoSearchNoSuccessfulSearches
          expr: |
            (sum(increase(navno_search_requests_total{app="navno-search-frontend",status="success"}[1h])) or vector(0)) == 0
            and on() hour() >= 8 and on() hour() < 15
            and on() day_of_week() >= 1 and on() day_of_week() <= 5
          for: 30m
          annotations:
            summary: No successful searches in navno-search-frontend for over 1.5 hours during the day
            consequence: The service may be down, unreachable or broken for users, or just no longer scraped.
            action: Check that the pods are running and being scraped, then check the service - e.g. https://www.nav.no/sok?ord=dagpenger.
          labels:
            namespace: navno
            severity: warning
